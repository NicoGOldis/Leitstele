<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitstellen-Spiel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <small>Deutschland</small>
            <h1>Leitstellen-Command</h1>
          </div>
        </div>

        <div class="header-metrics">
          <div class="metric">
            <div class="metric-label">Uhrzeit</div>
            <div class="metric-value" id="clock">00:00</div>
          </div>
          <div class="metric">
            <div class="metric-label">Schicht</div>
            <div class="metric-value" id="shift">0h</div>
          </div>
          <div class="metric">
            <div class="metric-label">Punktestand</div>
            <div class="metric-value" id="score">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Wetter</div>
            <div class="metric-value" id="weather">Klar</div>
          </div>
        </div>

        <div class="header-actions">
          <button class="light-btn" id="soundToggle" type="button">Ton: An</button>
          <button class="light-btn" id="syncButton" type="button">Lobby sync</button>
        </div>
      </header>

      <div class="dashboard">
        <aside class="panel">
          <div class="panel-header">
            <h2>Einsätze</h2>
            <span class="badge" id="incidentCount">0 offen</span>
          </div>
          <div class="list-wrap">
            <ul class="incident-list" id="incidentList"></ul>
          </div>
        </aside>

        <main class="panel map-panel">
          <div class="map-wrapper">
            <div id="map" aria-label="Deutschland-Karte"></div>
          </div>
        </main>

        <aside class="panel">
          <div class="dispatch-panel">
            <div class="dispatch-header">
              <h3>Alarmzentrale</h3>
              <span class="call-state" id="selectedRegion">Leitstelle</span>
            </div>
            <div id="incidentDetails"></div>
          </div>

          <div class="panel-header" style="padding-top: 0;">
            <h2>Einheiten</h2>
          </div>
          <div class="resource-grid" id="resourceGrid"></div>

          <div class="panel-header log-panel">
            <h2>Funkverkehr</h2>
          </div>
          <ul class="log-list" id="radioLog"></ul>
        </aside>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
